[tools]
python = "3.15.0"
uv = "0.13.1"
oxfmt = "0.73.0"

[tasks.install]
description = "Install Python dependencies from uv.lock without resolving"
run = "uv sync --locked"

[tasks.lint]
description = "Check Python, Markdown, YAML and TOML without writing"
depends = ["lint:*"]

[tasks."lint:py"]
description = "Check Python with ruff"
run = ["uv run ruff check --no-fix .", "uv run ruff format --check ."]

[tasks."lint:md"]
description = "Check Markdown, YAML and TOML formatting with oxfmt"
run = "oxfmt --check ."

[tasks.fix]
description = "Apply safe ruff fixes and format Python, Markdown, YAML and TOML"
run = ["uv run ruff check --fix .", "uv run ruff format .", "oxfmt ."]

[tasks.typecheck]
description = "Type-check src and tests with mypy strict"
run = "uv run mypy"

[tasks.test]
description = "Run the pytest suite"
run = "uv run pytest"

[tasks.check]
description = "Run lint, typecheck and test without writing files"
depends = ["lint", "typecheck", "test"]
