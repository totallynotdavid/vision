version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: cuda-toolkit
      - dependency-name: mpmath
      - dependency-name: nvidia-cudnn-cu13
      - dependency-name: nvidia-cusparselt-cu13
      - dependency-name: nvidia-nccl-cu13
      - dependency-name: nvidia-nvshmem-cu13
      - dependency-name: uv

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: cuda-toolkit
      - dependency-name: mpmath
      - dependency-name: nvidia-cudnn-cu13
      - dependency-name: nvidia-cusparselt-cu13
      - dependency-name: nvidia-nccl-cu13
      - dependency-name: nvidia-nvshmem-cu13
      - dependency-name: uv
