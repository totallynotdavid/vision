[project]
name = "vision"
version = "0.1.0"
description = "Oriented vehicle detection for MTC Peru intersections (Macro AP-rIoU@[0.50:0.80])"
readme = "readme.md"
requires-python = ">=3.14"

dependencies = [
    "numpy>=2.5.3,<3",
    "shapely>=2.1.2,<3",           # Rotated IoU geometry.
    "opencv-python-headless>=5.0.0.93", # OBB conversion, drawing, image IO.
    "pandas>=3.0.6",              # CSV inputs and run logs.
    "omegaconf>=2.3.1",           # Dotlist overrides and config composition.
    "scipy>=1.18.1",              # Hungarian matching for tracking.
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# Training extras pull torch and expect a GPU.
train = [
    "ultralytics>=8.4.172",       # YOLO26-OBB backend.
    "sahi>=0.12.7",               # Tiled inference.
    "lap>=0.5.13",                # Optional fast assignment backend.
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
