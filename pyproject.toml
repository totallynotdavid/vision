[project]
name = "vision"
version = "0.1.0"
description = "Oriented vehicle detection for MTC Peru intersections (Macro AP-rIoU@[0.50:0.80])"
readme = "readme.md"
requires-python = ">=3.14"

dependencies = [
  "numpy>=2.5.4,<3",
  "shapely>=2.2.0,<3", # Rotated IoU geometry.
  "opencv-python-headless>=5.0.0.93", # OBB conversion, drawing, image IO.
  "pandas>=3.0.6", # CSV inputs and run logs.
  "omegaconf>=2.4.0", # Dotlist overrides and config composition.
  "scipy>=1.18.1", # Hungarian matching for tracking.
]

[project.optional-dependencies]
# Training extras pull torch and expect a GPU.
train = [
  "ultralytics>=8.4.177", # YOLO26-OBB backend.
  "sahi>=0.12.8", # Tiled inference.
]

[dependency-groups]
dev = [
  "mypy>=1.20.0",
  "pandas-stubs>=3.0.0",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "scipy-stubs>=1.18.0",
  "types-shapely>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

# Treat optional training dependencies as Any.
[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "sahi", "sahi.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
